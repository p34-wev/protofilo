<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Dashboard — Portfolio</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/admin.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
</head>

<body class="admin-body">

  <!-- LOGIN OVERLAY -->
  <div class="login-overlay" id="loginOverlay">
    <div class="login-card">
      <h1>Admin Login</h1>
      <p>Portfolio Management Dashboard</p>
      <form id="loginForm" novalidate>
        <div class="form-group">
          <label for="adminUsername">Username</label>
          <input type="text" id="adminUsername" name="username" placeholder="admin" required autocomplete="username" />
        </div>
        <div class="form-group">
          <label for="adminPassword">Password</label>
          <input type="password" id="adminPassword" name="password" placeholder="••••••••" required
            autocomplete="current-password" />
        </div>
        <button type="submit" class="btn btn-primary btn-full" id="loginBtn">Login</button>
        <div class="form-status" id="loginStatus" role="alert" aria-live="polite"></div>
      </form>
    </div>
  </div>

  <!-- DASHBOARD -->
  <div class="dashboard" id="dashboard" hidden>
    <aside class="sidebar">
      <div class="sidebar-logo">PS Admin</div>
      <nav class="sidebar-nav">
        <a href="#" class="sidebar-link active" data-tab="projects">Projects</a>
        <a href="#" class="sidebar-link" data-tab="messages">
          Messages <span class="badge" id="unreadBadge">0</span>
        </a>
      </nav>
      <button class="btn btn-outline sidebar-logout" id="logoutBtn">Logout</button>
    </aside>

    <main class="admin-main">
      <!-- PROJECTS TAB -->
      <div class="tab-content active" id="tab-projects">
        <div class="admin-header">
          <h2>Projects</h2>
          <button class="btn btn-primary" id="addProjectBtn">+ Add Project</button>
        </div>
        <div class="table-wrapper">
          <table class="admin-table" id="projectsTable">
            <thead>
              <tr>
                <th>#</th>
                <th>Title</th>
                <th>Tech Stack</th>
                <th>Featured</th>
                <th>Order</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="projectsTbody">
              <tr>
                <td colspan="6" class="text-center">Loading…</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>

      <!-- MESSAGES TAB -->
      <div class="tab-content" id="tab-messages" hidden>
        <div class="admin-header">
          <h2>Contact Messages</h2>
        </div>
        <div class="table-wrapper">
          <table class="admin-table" id="messagesTable">
            <thead>
              <tr>
                <th>#</th>
                <th>Name</th>
                <th>Email</th>
                <th>Subject</th>
                <th>Date</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="messagesTbody">
              <tr>
                <td colspan="6" class="text-center">Loading…</td>
              </tr>
            </tbody>
          </table>
        </div>
        <div id="messagePagination" class="pagination"></div>
      </div>
    </main>
  </div>

  <!-- PROJECT MODAL -->
  <div class="modal-overlay" id="projectModal" hidden role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-card">
      <div class="modal-header">
        <h3 id="modalTitle">Add Project</h3>
        <button class="modal-close" id="modalClose" aria-label="Close">&#x2715;</button>
      </div>
      <form id="projectForm" novalidate>
        <input type="hidden" id="projectId" />
        <div class="form-group">
          <label for="pTitle">Title <span class="required">*</span></label>
          <input type="text" id="pTitle" required maxlength="150" />
        </div>
        <div class="form-group">
          <label for="pDesc">Description <span class="required">*</span></label>
          <textarea id="pDesc" rows="3" required></textarea>
        </div>
        <div class="form-group">
          <label for="pTech">Tech Stack <span class="required">*</span></label>
          <input type="text" id="pTech" required maxlength="500" placeholder="React, Spring Boot, MySQL" />
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="pGithub">GitHub URL</label>
            <input type="url" id="pGithub" maxlength="300" />
          </div>
          <div class="form-group">
            <label for="pLive">Live URL</label>
            <input type="url" id="pLive" maxlength="300" />
          </div>
        </div>
        <div class="form-group">
          <label for="pImage">Image URL</label>
          <input type="url" id="pImage" maxlength="300" />
        </div>
        <div class="form-row">
          <div class="form-group form-check">
            <label>
              <input type="checkbox" id="pFeatured" />
              Featured
            </label>
          </div>
          <div class="form-group">
            <label for="pOrder">Display Order</label>
            <input type="number" id="pOrder" min="0" value="0" />
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline" id="modalCancelBtn">Cancel</button>
          <button type="submit" class="btn btn-primary" id="saveProjectBtn">Save</button>
        </div>
        <div class="form-status" id="projectFormStatus" role="alert" aria-live="polite"></div>
      </form>
    </div>
  </div>

  <!-- MESSAGE DETAIL MODAL -->
  <div class="modal-overlay" id="messageModal" hidden role="dialog" aria-modal="true" aria-labelledby="msgModalTitle">
    <div class="modal-card">
      <div class="modal-header">
        <h3 id="msgModalTitle">Message</h3>
        <button class="modal-close" id="msgModalClose" aria-label="Close">&#x2715;</button>
      </div>
      <div id="messageDetail"></div>
    </div>
  </div>

  <script src="js/admin.js"></script>
</body>

</html>
